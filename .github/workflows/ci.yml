name: CI

# The app lives one directory below the repository root, so every step runs from there.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: okr-transparency-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: okr-transparency-app/package-lock.json

      - run: npm ci

      - run: npm test

      # tsconfig.json is `strict` and covers the test files too, but nothing ran it: the Turbopack
      # build does not type-check, so this was the one signal with no gate behind it.
      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build

      # Running the app rewrites tracked files -- a publish writes data/*.json -- and they then
      # land in a later commit by accident. Every tracked file is checked rather than data/ alone:
      # next-env.d.ts was tracked until recently, and a build rewriting it in the app root went
      # straight through the narrower version of this step.
      - name: Check the run left no tracked file modified
        run: |
          if [ -n "$(git status --porcelain -uno)" ]; then
            echo "Running the checks modified tracked files:"
            git status --porcelain -uno
            exit 1
          fi

  # The HCL had no gate at all: it is only ever exercised on the one machine that holds the state,
  # so a syntax or schema error would surface there rather than on the PR that introduced it.
  # `init -backend=false` downloads the providers without touching any state, and `validate` makes
  # no API calls -- so this needs no credentials and cannot reach the running service.
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: okr-transparency-app/deploy/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - run: terraform fmt -check -recursive

      - run: terraform init -backend=false

      - run: terraform validate
