name: CI

# The app lives one directory below the repository root, so every step runs from there.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: okr-transparency-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: okr-transparency-app/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run lint

      - run: npm run build

      # data/*.json are tracked, so a step that writes them would land in a later commit by
      # accident. Fail loudly instead of letting that through unnoticed.
      - name: Check no tracked data file was modified
        run: |
          if [ -n "$(git status --porcelain -- data)" ]; then
            echo "The build modified tracked files under data/:"
            git status --porcelain -- data
            exit 1
          fi
